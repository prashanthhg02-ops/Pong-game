<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b14">
  <title>NEON PONG</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080b14;
      color: #f3f7ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #7e8ba8;
      --cyan: #62f5e2;
      --pink: #ff5c9a;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(34, 52, 92, .3), transparent 55%),
        #080b14;
    }

    .game-shell { width: min(100%, 960px); }

    .topbar, .scoreboard, .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar { margin-bottom: 20px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .22em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(98, 245, 226, .4);
      border-radius: 10px;
      color: var(--cyan);
      font-size: 17px;
      box-shadow: 0 0 22px rgba(98, 245, 226, .12), inset 0 0 14px rgba(98, 245, 226, .08);
    }

    .eyebrow, .player-label, .status-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #b9c4d9;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    .scoreboard {
      max-width: 540px;
      margin: 0 auto 15px;
      padding: 0 16px;
    }

    .player-score { min-width: 100px; }
    .player-score:last-child { text-align: right; }

    .player-label { display: block; margin-bottom: 5px; }
    .player-label.you { color: var(--cyan); }
    .player-label.cpu { color: var(--pink); }

    .score {
      font-size: clamp(36px, 7vw, 52px);
      font-weight: 750;
      line-height: 1;
      letter-spacing: -.06em;
      font-variant-numeric: tabular-nums;
    }

    .score-divider {
      align-self: end;
      padding-bottom: 7px;
      color: #39445d;
      font-size: 20px;
      font-weight: 300;
    }

    .arena {
      position: relative;
      overflow: hidden;
      border: 1px solid #27334b;
      border-radius: 16px;
      background: #0a1020;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .4), 0 0 50px rgba(72, 105, 177, .08);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 8 / 5;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(5, 9, 18, .58);
      backdrop-filter: blur(5px);
      transition: opacity .2s ease, visibility .2s ease;
    }

    .overlay[hidden] { display: none; }

    .dialog {
      max-width: 360px;
      text-align: center;
      animation: arrive .35s ease both;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dialog-kicker {
      margin: 0 0 10px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 52px);
      line-height: .98;
      letter-spacing: -.065em;
    }

    .dialog-copy {
      margin: 14px 0 22px;
      color: #a3afc7;
      font-size: 13px;
      line-height: 1.6;
    }

    button {
      border: 0;
      color: #07110f;
      background: var(--cyan);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease, background .15s ease;
    }

    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 2px solid white; outline-offset: 4px; }

    .primary-button {
      min-width: 150px;
      padding: 12px 21px;
      border-radius: 8px;
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      box-shadow: 0 0 24px rgba(98, 245, 226, .2);
    }

    .bottom-bar {
      gap: 14px;
      margin-top: 15px;
      color: var(--muted);
      font-size: 11px;
    }

    .controls-hint { display: flex; align-items: center; gap: 8px; }

    kbd {
      min-width: 23px;
      padding: 4px 6px;
      border: 1px solid #2a354c;
      border-radius: 5px;
      color: #b8c3d8;
      background: #111827;
      font: 10px ui-monospace, SFMono-Regular, Consolas, monospace;
      text-align: center;
    }

    .bottom-actions { display: flex; align-items: center; gap: 8px; }

    .utility-button {
      padding: 8px 11px;
      border: 1px solid #2a354c;
      border-radius: 7px;
      color: #c1cbe0;
      background: #101727;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .touch-controls {
      display: none;
      gap: 10px;
      margin-top: 14px;
    }

    .touch-controls button {
      flex: 1;
      min-height: 48px;
      border: 1px solid #2a354c;
      border-radius: 9px;
      color: #d4def2;
      background: #101727;
      font-size: 18px;
      touch-action: none;
    }

    .touch-controls button:active, .touch-controls button.held {
      color: #07110f;
      background: var(--cyan);
    }

    .footer-note {
      margin: 28px 0 0;
      color: #56627b;
      font-size: 10px;
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      body { padding: 18px 12px; }
      .topbar { margin-bottom: 15px; }
      .brand { font-size: 11px; }
      .status { font-size: 9px; }
      .bottom-bar { font-size: 10px; }
      .controls-hint { gap: 5px; }
      .bottom-actions { gap: 5px; }
      .utility-button { padding: 8px; font-size: 9px; }
      .touch-controls { display: flex; }
      .footer-note { margin-top: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">▰</span> NEON PONG</div>
      <div class="status"><span class="status-dot" id="status-dot"></span><span id="status-text">Ready to play</span></div>
    </header>

    <section class="scoreboard" aria-label="Score">
      <div class="player-score">
        <span class="player-label you">You</span>
        <span class="score" id="player-score" aria-label="Your score">0</span>
      </div>
      <span class="score-divider" aria-hidden="true">:</span>
      <div class="player-score">
        <span class="player-label cpu">CPU</span>
        <span class="score" id="cpu-score" aria-label="CPU score">0</span>
      </div>
    </section>

    <div class="arena">
      <canvas id="game" width="960" height="600" aria-label="Pong game. Move your paddle with W and S or the arrow keys."></canvas>
      <div class="overlay" id="overlay">
        <div class="dialog">
          <p class="dialog-kicker" id="dialog-kicker">First to 7 wins</p>
          <h1 id="dialog-title">Ready<br>to rally?</h1>
          <p class="dialog-copy" id="dialog-copy">Outplay the CPU. Move with W / S, the arrow keys, or your mouse.</p>
          <button class="primary-button" id="primary-button" type="button">Start game</button>
        </div>
      </div>
    </div>

    <div class="touch-controls" aria-label="Touch controls">
      <button type="button" data-direction="-1" aria-label="Move paddle up">▲</button>
      <button type="button" data-direction="1" aria-label="Move paddle down">▼</button>
    </div>

    <div class="bottom-bar">
      <div class="controls-hint"><kbd>W</kbd><kbd>S</kbd><span>or</span><kbd>↑</kbd><kbd>↓</kbd><span>Move</span></div>
      <div class="bottom-actions">
        <button class="utility-button" id="pause-button" type="button">Pause <span aria-hidden="true">Ⅱ</span></button>
        <button class="utility-button" id="restart-button" type="button">Restart ↻</button>
      </div>
    </div>
    <p class="footer-note">Move your paddle · First to 7 takes the match</p>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const overlay = document.querySelector("#overlay");
      const title = document.querySelector("#dialog-title");
      const kicker = document.querySelector("#dialog-kicker");
      const copy = document.querySelector("#dialog-copy");
      const primaryButton = document.querySelector("#primary-button");
      const statusText = document.querySelector("#status-text");
      const statusDot = document.querySelector("#status-dot");
      const playerScoreText = document.querySelector("#player-score");
      const cpuScoreText = document.querySelector("#cpu-score");
      const pauseButton = document.querySelector("#pause-button");

      const W = canvas.width;
      const H = canvas.height;
      const WIN_SCORE = 7;
      const paddle = { width: 12, height: 112, inset: 38, speed: 520 };
      const ball = { x: W / 2, y: H / 2, radius: 9, vx: 0, vy: 0, speed: 430 };
      const player = { x: paddle.inset, y: H / 2 };
      const cpu = { x: W - paddle.inset - paddle.width, y: H / 2 };

      let playerScore = 0;
      let cpuScore = 0;
      let state = "ready";
      let lastFrame = 0;
      const keys = new Set();
      const touchDirections = new Set();

      function setStatus(text, active = false) {
        statusText.textContent = text;
        statusDot.style.background = active ? "var(--cyan)" : "#8290aa";
        statusDot.style.boxShadow = active ? "0 0 12px var(--cyan)" : "none";
      }

      function showOverlay(type) {
        overlay.hidden = false;
        if (type === "ready") {
          kicker.textContent = `First to ${WIN_SCORE} wins`;
          title.innerHTML = "Ready<br>to rally?";
          copy.textContent = "Outplay the CPU. Move with W / S, the arrow keys, or your mouse.";
          primaryButton.textContent = "Start game";
        } else if (type === "paused") {
          kicker.textContent = "Take your time";
          title.innerHTML = "Game<br>paused";
          copy.textContent = "Your rally is waiting right where you left it.";
          primaryButton.textContent = "Resume";
        } else {
          const won = type === "won";
          kicker.textContent = won ? "Match complete" : "Match complete";
          title.innerHTML = won ? "You<br>win!" : "CPU<br>wins";
          copy.textContent = won ? "A flawless rally. Ready for another match?" : "The CPU takes this one. Want a rematch?";
          primaryButton.textContent = "Play again";
        }
      }

      function resetBall(direction = Math.random() < .5 ? -1 : 1) {
        ball.x = W / 2;
        ball.y = H / 2;
        ball.speed = 430;
        const angle = (Math.random() * .7 - .35);
        ball.vx = Math.cos(angle) * ball.speed * direction;
        ball.vy = Math.sin(angle) * ball.speed;
      }

      function startGame() {
        if (state === "ready" || state === "over") {
          playerScore = 0;
          cpuScore = 0;
          player.y = H / 2;
          cpu.y = H / 2;
          updateScores();
          resetBall();
        }
        state = "playing";
        overlay.hidden = true;
        pauseButton.innerHTML = 'Pause <span aria-hidden="true">Ⅱ</span>';
        setStatus("Match in progress", true);
        lastFrame = performance.now();
      }

      function pauseGame() {
        if (state === "playing") {
          state = "paused";
          showOverlay("paused");
          pauseButton.innerHTML = 'Resume <span aria-hidden="true">▶</span>';
          setStatus("Paused");
        } else if (state === "paused") {
          startGame();
        }
      }

      function restartGame() {
        state = "ready";
        playerScore = 0;
        cpuScore = 0;
        player.y = H / 2;
        cpu.y = H / 2;
        resetBall();
        updateScores();
        pauseButton.innerHTML = 'Pause <span aria-hidden="true">Ⅱ</span>';
        setStatus("Ready to play");
        showOverlay("ready");
      }

      function updateScores() {
        playerScoreText.textContent = String(playerScore);
        cpuScoreText.textContent = String(cpuScore);
      }

      function scorePoint(side) {
        if (side === "player") playerScore += 1;
        else cpuScore += 1;
        updateScores();

        if (playerScore >= WIN_SCORE || cpuScore >= WIN_SCORE) {
          state = "over";
          const result = playerScore >= WIN_SCORE ? "won" : "lost";
          showOverlay(result);
          pauseButton.innerHTML = 'Pause <span aria-hidden="true">Ⅱ</span>';
          setStatus(result === "won" ? "You won the match" : "CPU won the match");
          return;
        }

        resetBall(side === "player" ? 1 : -1);
      }

      function movePlayer(dt) {
        const up = keys.has("ArrowUp") || keys.has("w") || keys.has("W") || touchDirections.has(-1);
        const down = keys.has("ArrowDown") || keys.has("s") || keys.has("S") || touchDirections.has(1);
        if (up !== down) player.y += (down ? 1 : -1) * paddle.speed * dt;
        player.y = Math.max(paddle.height / 2, Math.min(H - paddle.height / 2, player.y));
      }

      function update(dt) {
        movePlayer(dt);

        const cpuTarget = ball.vx > 0 ? ball.y : H / 2;
        const cpuSpeed = ball.vx > 0 ? 390 : 250;
        const difference = cpuTarget - cpu.y;
        cpu.y += Math.sign(difference) * Math.min(Math.abs(difference), cpuSpeed * dt);
        cpu.y = Math.max(paddle.height / 2, Math.min(H - paddle.height / 2, cpu.y));

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        if (ball.y - ball.radius <= 0) {
          ball.y = ball.radius;
          ball.vy = Math.abs(ball.vy);
        } else if (ball.y + ball.radius >= H) {
          ball.y = H - ball.radius;
          ball.vy = -Math.abs(ball.vy);
        }

        if (ball.vx < 0 && ball.x - ball.radius <= player.x + paddle.width
            && ball.x > player.x && ball.y >= player.y - paddle.height / 2 - ball.radius
            && ball.y <= player.y + paddle.height / 2 + ball.radius) {
          bounceFromPaddle(player, 1);
        } else if (ball.vx > 0 && ball.x + ball.radius >= cpu.x
            && ball.x < cpu.x + paddle.width && ball.y >= cpu.y - paddle.height / 2 - ball.radius
            && ball.y <= cpu.y + paddle.height / 2 + ball.radius) {
          bounceFromPaddle(cpu, -1);
        }

        if (ball.x + ball.radius < 0) scorePoint("cpu");
        else if (ball.x - ball.radius > W) scorePoint("player");
      }

      function bounceFromPaddle(target, direction) {
        const offset = (ball.y - target.y) / (paddle.height / 2);
        const angle = Math.max(-1, Math.min(1, offset)) * 1.05;
        ball.speed = Math.min(ball.speed + 24, 760);
        ball.vx = Math.cos(angle) * ball.speed * direction;
        ball.vy = Math.sin(angle) * ball.speed;
        ball.x = direction > 0 ? target.x + paddle.width + ball.radius : target.x - ball.radius;
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#0a1020";
        ctx.fillRect(0, 0, W, H);

        const glow = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, 470);
        glow.addColorStop(0, "rgba(35, 55, 96, .22)");
        glow.addColorStop(1, "rgba(10, 16, 32, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.setLineDash([10, 13]);
        ctx.strokeStyle = "rgba(128, 151, 190, .24)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(W / 2, 0);
        ctx.lineTo(W / 2, H);
        ctx.stroke();
        ctx.restore();

        drawPaddle(player, "#62f5e2");
        drawPaddle(cpu, "#ff5c9a");

        ctx.save();
        ctx.shadowColor = "#f3f7ff";
        ctx.shadowBlur = 22;
        ctx.fillStyle = "#f3f7ff";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = "rgba(255, 255, 255, .1)";
        ctx.beginPath();
        ctx.arc(W / 2, H / 2, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawPaddle(target, color) {
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 20;
        ctx.fillStyle = color;
        roundRect(target.x, target.y - paddle.height / 2, paddle.width, paddle.height, 6);
        ctx.fill();
        ctx.restore();
      }

      function roundRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
      }

      function frame(now) {
        const dt = Math.min((now - lastFrame) / 1000 || 0, .04);
        lastFrame = now;
        if (state === "playing") update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      primaryButton.addEventListener("click", startGame);
      pauseButton.addEventListener("click", pauseGame);
      document.querySelector("#restart-button").addEventListener("click", restartGame);

      document.addEventListener("keydown", (event) => {
        if (["ArrowUp", "ArrowDown", " "].includes(event.key)) event.preventDefault();
        keys.add(event.key);
        if (event.key === " " && !event.repeat) {
          if (state === "playing") pauseGame();
          else if (state === "paused" || state === "ready" || state === "over") startGame();
        }
        if (event.key === "Escape" && state === "playing") pauseGame();
      });

      document.addEventListener("keyup", (event) => keys.delete(event.key));
      window.addEventListener("blur", () => {
        keys.clear();
        touchDirections.clear();
        document.querySelectorAll(".touch-controls button").forEach((button) => button.classList.remove("held"));
      });

      canvas.addEventListener("pointermove", (event) => {
        if (event.pointerType === "mouse" && state === "playing") {
          const bounds = canvas.getBoundingClientRect();
          player.y = ((event.clientY - bounds.top) / bounds.height) * H;
          player.y = Math.max(paddle.height / 2, Math.min(H - paddle.height / 2, player.y));
        }
      });

      canvas.addEventListener("pointerdown", (event) => {
        if (event.pointerType !== "mouse" && state === "playing") {
          const bounds = canvas.getBoundingClientRect();
          player.y = ((event.clientY - bounds.top) / bounds.height) * H;
          player.y = Math.max(paddle.height / 2, Math.min(H - paddle.height / 2, player.y));
        }
      });

      document.querySelectorAll(".touch-controls button").forEach((button) => {
        const direction = Number(button.dataset.direction);
        const release = () => {
          touchDirections.delete(direction);
          button.classList.remove("held");
        };
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          touchDirections.add(direction);
          button.classList.add("held");
          button.setPointerCapture(event.pointerId);
        });
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      });

      showOverlay("ready");
      draw();
      requestAnimationFrame((now) => {
        lastFrame = now;
        frame(now);
      });
    })();
  </script>
</body>
</html>
